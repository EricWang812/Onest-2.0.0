# Not run in this environment (no Docker available) — see DECISIONS.md.
# Usage: docker compose up -d   (from the repo root or this directory)
services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    ports:
      - '8787:8787'
    volumes:
      - relay-data:/data
    environment:
      - PORT=8787
      - RELAY_DB_PATH=/data/relay.sqlite
    restart: unless-stopped

volumes:
  relay-data:
